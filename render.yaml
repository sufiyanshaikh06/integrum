services:
  - type: web
    name: integrum-backend
    env: node
    plan: free
    branch: fix/backend-closure-day1
    rootDir: .
    buildCommand: npm install && npm run build --workspace backend
    preDeployCommand: npm run db:migrate --workspace backend
    startCommand: node backend/dist/server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false # Set to your Vercel frontend URL, e.g. https://<app>.vercel.app
      - key: DATABASE_URL
        sync: false # Supabase Transaction Pooler (port 6543, pgbouncer=true) for runtime queries
      - key: DIRECT_URL
        sync: false # Supabase Direct / Session Connection (port 5432) for Prisma migrations
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "lax" # Model B: Vercel proxy rewrites preserve same-origin cookie scope
      - key: REMINDER_INTERVAL_MS
        value: "60000"
      - key: AI_PROVIDER
        value: mock
      - key: STORAGE_PROVIDER
        value: local
      - key: EMAIL_PROVIDER
        value: console
      - key: SEED_ADMIN_EMAIL
        value: admin@integrum.dev
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
